[build-system]
requires = ["scikit-build-core", "pybind11", "wheel", "torch>=2.14"]
build-backend = "scikit_build_core.build"

[project]
name = "nelux"
version = "0.22.0"
readme = "README.md"
authors = [
    {name = "Nilas Tiago", email = "nilascontact@gmail.com"},
]
description = "Lightspeed video decoding directly into tensors!"
requires-python = ">=3.13"
license = {text = "AGPL-3.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
keywords = ["ffmpeg", "video", "ml", "pytorch", "decode", "tensors", "inference"]
# numpy is imported unconditionally by nelux/batch.py, which nelux/__init__.py
# imports, so `import nelux` fails without it. torch is deliberately absent:
# the wheel uses only the PyTorch stable ABI and works with any torch >= 2.14,
# but a torch requirement here would let pip replace the user's CUDA/CPU build
# with PyPI's default one (CPU-only on Windows) whenever theirs is older, so
# __init__.py raises a clear ImportError below 2.14 instead.
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/NevermindNilas/Nelux"
Repository = "https://github.com/NevermindNilas/Nelux"
Documentation = "https://github.com/NevermindNilas/Nelux/blob/master/README.md"
Changelog = "https://github.com/NevermindNilas/Nelux/blob/master/docs/CHANGELOG.md"
Issues = "https://github.com/NevermindNilas/Nelux/issues"

[tool.scikit-build]
cmake.build-type = "Release"
build.verbose = true
ninja.make-fallback = false

[tool.scikit-build.cmake.define]
NELUX_ENABLE_CUDA = {env="NELUX_ENABLE_CUDA", default="OFF"}
NELUX_BUNDLE_FFMPEG_DLLS = {env="NELUX_BUNDLE_FFMPEG_DLLS", default="ON"}

[tool.pytest.ini_options]
testpaths = ["tests"]

