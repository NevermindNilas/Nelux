# ===========================================================================
# PER-PLATFORM FEATURE DIFFERENCES (TAS-FFMPEG README.md#encoders-per-platform)
#   NVENC/NVDEC/CUVID   everywhere except macOS
#   Vulkan              everywhere except macOS (new in v9.0.2; loader dlopen'd)
#   QSV (libvpl)        Windows + Linux x86_64 only
#   AMF                 Windows + Linux x86_64 only
#   MediaFoundation     Windows only  (h264_mf, hevc_mf)
#   VideoToolbox        macOS only    (h264/hevc/prores_videotoolbox)
#   libx264/libx265/libsvtav1/libaom/libvpx/libopenh264/libopus/libzimg/libvmaf
#   and a TLS backend for https:// exist on ALL five.
# ===========================================================================

# --- Stale-tree guard --------------------------------------------------------
# download_ffmpeg.{sh,ps1} stamp what they installed into this file inside the
# output directory and refuse to skip a re-download unless the stamp matches
# what this lock asks for. Without it their "FFmpeg already present" short
# circuit silently keeps an older tree — which matters a lot here, because
# CMakeLists.txt globs external/ffmpeg/bin/av*.dll at configure time to bake
# /DELAYLOAD:<filename>, so a stale tree produces a wheel whose delay-load
# contract names the wrong soname generation.
PIN_STAMP_FILE=.nelux-ffmpeg-pin
