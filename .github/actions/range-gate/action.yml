name: Validate installed wheel ranges
description: Mandatory range regressions and known-frame FFmpeg corpus comparisons
inputs:
  artifact-name:
    description: Unique report artifact name for this matrix job
    required: true
  require-nvdec:
    description: Fail if the hardware backend cannot run (GPU runners only)
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install test dependencies
      shell: bash
      run: python -m pip install pytest numpy
    - name: Gate the repaired wheel
      shell: bash
      env:
        REQUIRE_NVDEC: ${{ inputs.require-nvdec }}
      run: |
        GPU_ARGS=()
        if [ "$REQUIRE_NVDEC" = "true" ]; then GPU_ARGS+=(--require-nvdec); fi
        python tools/run_wheel_range_gate.py \
          --wheel-dir dist \
          --ffmpeg-bin external/ffmpeg/bin \
          --output range-gate-results "${GPU_ARGS[@]}"
    - name: Upload range validation evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: range-gate-results/
        if-no-files-found: error
