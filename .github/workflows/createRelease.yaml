name: CI Release (Windows / Linux / macOS)

permissions:
  contents: write

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  DIST_DIR: "dist"
  VCPKG_LIBRARY_LINKAGE: dynamic

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      SKBUILD_CONFIG: Release
      VCPKG_TARGET_TRIPLET: x64-windows-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Upgrade pip & install deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install scikit-build-core pybind11 numpy ninja
          python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cu132

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg
            ${{ runner.temp }}/vcpkg/installed
            ${{ runner.temp }}/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-dav1d-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-dav1d-v2-

      - name: Bootstrap vcpkg
        shell: powershell
        run: |
          if (-not (Test-Path "${{ runner.temp }}/vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
          }
          & "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Update vcpkg ports
        shell: cmd
        run: |
          cd "${{ runner.temp }}\vcpkg"
          git fetch origin master
          git reset --hard origin/master
          git clean -fd

      - name: Set VCPKG env vars
        shell: bash
        run: |
          echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg"                          >> $GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_FILE=${RUNNER_TEMP}/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=x64-windows-release"                        >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${RUNNER_TEMP}/vcpkg/installed/x64-windows-release"                       >> $GITHUB_ENV

      - name: Install C++ deps via vcpkg
        shell: cmd
        run: |
          "${{ runner.temp }}\vcpkg\vcpkg" install spdlog fmt --triplet x64-windows-release --recurse

      - name: Download FFmpeg 8.x for build (headers/libs only)
        shell: powershell
        run: |
          # Pinned to FFmpeg 8.1 (BtbN gpl-shared) — same source/version as the
          # Linux build for ABI consistency. Build needs headers + import libs
          # only; DLLs are NOT bundled — users must have FFmpeg in their PATH.
          $FFmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip"
          $OutputDir = "${{ github.workspace }}/external/ffmpeg"
          $TempDir = "${{ runner.temp }}/ffmpeg_download"

          New-Item -ItemType Directory -Path $TempDir -Force | Out-Null
          New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null

          Write-Host "Downloading FFmpeg 8.1 (for build-time headers/libs only)..."
          curl.exe -L --retry 3 --retry-delay 2 -o "$TempDir/ffmpeg.zip" $FFmpegUrl

          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path "$TempDir/ffmpeg.zip" -DestinationPath "$TempDir/extracted" -Force

          $FFmpegDir = Get-ChildItem -Path "$TempDir/extracted" -Directory | Select-Object -First 1
          # Copy all directories including bin (needed for running tests, but NOT bundled by CMake)
          Copy-Item -Path "$($FFmpegDir.FullName)/bin" -Destination $OutputDir -Recurse -Force
          Copy-Item -Path "$($FFmpegDir.FullName)/lib" -Destination $OutputDir -Recurse -Force
          Copy-Item -Path "$($FFmpegDir.FullName)/include" -Destination $OutputDir -Recurse -Force

          Write-Host "=== FFmpeg installed (headers/libs for build, bin for testing) ==="

      - name: Setup CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        id: cuda-toolkit
        with:
          cuda: "13.1.0"
          method: "local"
          use-github-cache: true
          use-local-cache: true

      - name: Verify and Fix CUDA installation
        shell: bash
        run: |
          echo "CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          ls -la "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin/" | head -20
          "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin/nvcc.exe" --version

          CUDA_INC="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/include"
          echo "Checking for host_config.h in $CUDA_INC..."

          # CUDA 13.x moved host_config.h - fix by ensuring it exists in include/crt/
          if [ -f "$CUDA_INC/crt/host_config.h" ]; then
            echo "SUCCESS: host_config.h found at include/crt/"
          elif [ -f "$CUDA_INC/host_config.h" ]; then
            echo "FOUND: host_config.h at include/ (CUDA 13.x location)"
            echo "FIXING: Copying to include/crt/host_config.h for compatibility..."
            mkdir -p "$CUDA_INC/crt"
            cp "$CUDA_INC/host_config.h" "$CUDA_INC/crt/host_config.h"
            echo "FIX APPLIED."
          else
            echo "FATAL: host_config.h NOT found!"
            echo "CUDA installation is incomplete. Cannot build CUDA wheel."
            find "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" -name "host_config.h" || true
            exit 1
          fi

      - name: Build Windows wheel
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
          SKBUILD_CONFIG: Release
          NELUX_ENABLE_CUDA: "ON"
          NELUX_BUNDLE_FFMPEG_DLLS: "OFF"
        run: |
          # Convert backslashes to forward slashes to avoid CMake escaping issues on Windows
          TEMP_FWD=$(echo "$RUNNER_TEMP" | tr '\\' '/')

          # Sanitize CUDA_PATH path as well
          CUDA_PATH_FWD=$(echo "$CUDA_PATH" | tr '\\' '/')
          export CUDA_PATH="$CUDA_PATH_FWD"

          export VCPKG_ROOT="${TEMP_FWD}/vcpkg"
          export VCPKG_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          export VCPKG_TARGET_TRIPLET=x64-windows-release
          export CMAKE_PREFIX_PATH="${VCPKG_ROOT}/installed/x64-windows-release"

          # Construct CMAKE_ARGS with sanitized paths and explicit wheel-bundling policy.
          export CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=${VCPKG_TOOLCHAIN_FILE} -DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET} -DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH} -DNELUX_ENABLE_CUDA=ON -DNELUX_BUNDLE_FFMPEG_DLLS=OFF"

          echo "CMAKE_ARGS: $CMAKE_ARGS"
          # Use --no-build-isolation so we usage the pre-installed CUDA-enabled Torch
          python -m pip wheel . --no-deps --no-build-isolation -w dist -v

      - name: Debug - List nelux folder and wheel contents
        shell: powershell
        run: |
          Write-Host "=== Contents of nelux/ folder (post-build) ==="
          Get-ChildItem -Path nelux -Recurse | ForEach-Object { 
            Write-Host "$($_.Length) bytes - $($_.FullName)" 
          }
          Write-Host "=== Contents of dist/ folder ==="
          Get-ChildItem -Path dist | ForEach-Object { 
            Write-Host "$($_.Length) bytes - $($_.Name)" 
          }

      - name: Repair wheel with delvewheel (bundle DLLs)
        shell: powershell
        run: |
          Write-Host "=== Installing delvewheel ==="
          pip install delvewheel

          Write-Host "=== Setting up DLL search paths ==="
          $VcpkgBin = Join-Path $env:RUNNER_TEMP "vcpkg\installed\x64-windows-release\bin"

          # Locating Torch DLLs (needed so delvewheel finds them, but we EXCLUDE them from bundling)
          $TorchSite = python -c "import torch, os; print(os.path.dirname(torch.__file__))"
          $TorchLib = Join-Path $TorchSite "lib"

          # FFmpeg DLLs (for build/test, but NOT bundled)
          $FFmpegBin = "${{ github.workspace }}/external/ffmpeg/bin"

          # Dynamically get list of ALL FFmpeg DLLs to exclude them
          $FFmpegDlls = Get-ChildItem -Path $FFmpegBin -Filter "*.dll" | Select-Object -ExpandProperty Name
          $FFmpegExclude = $FFmpegDlls -join ";"

          Write-Host "VCPKG bin: $VcpkgBin"
          Write-Host "Torch lib: $TorchLib"
          Write-Host "FFmpeg bin: $FFmpegBin"
          Write-Host "Excluding FFmpeg DLLs: $FFmpegExclude"

          # Find the wheel file
          $WheelFile = Get-ChildItem dist/*.whl | Select-Object -First 1
          Write-Host "Repairing wheel: $($WheelFile.FullName)"

          New-Item -ItemType Directory -Path dist_repaired -Force | Out-Null

          # Run delvewheel repair
          # Note: We don't add CUDA bin path - CUDA DLLs come from PyTorch installation
          delvewheel repair $WheelFile.FullName `
            --add-path "$VcpkgBin" `
            --add-path "$TorchLib" `
            --add-path "$FFmpegBin" `
            --exclude "torch_cpu.dll;c10.dll;c10_cuda.dll;torch_python.dll;torch.dll;torch_cuda.dll;cudart64*.dll;nvrtc64*.dll;nvrtc-builtins64*.dll;cufft64*.dll;curand64*.dll;cusolver64*.dll;cusparse64*.dll;cudnn64*.dll;nvToolsExt64*.dll;$FFmpegExclude" `
            --wheel-dir dist_repaired `
            -v

          # Replace original wheel with repaired one
          Remove-Item dist/*.whl -Force
          Move-Item dist_repaired/*.whl dist/
          Remove-Item dist_repaired -Recurse -Force
          Write-Host "=== Wheel repair complete ==="

      - name: List wheel contents
        run: |
          echo "=== Wheel contents (CUDA DLLs bundled via delvewheel, FFmpeg NOT bundled) ==="
          unzip -l dist/*.whl | grep nelux/

      - name: Test wheel (import + real decode smoke test)
        shell: powershell
        run: |
          Write-Host "=== Installing wheel ==="
          pip install (Get-ChildItem dist/*.whl) --force-reinstall

          $FFmpegBin = Join-Path $pwd "external\ffmpeg\bin"
          $env:PATH = "$FFmpegBin;$env:PATH"
          $env:FFMPEG_BIN = $FFmpegBin

          # GitHub's powershell shell runs with $ErrorActionPreference='Stop',
          # which turns ANY native stderr line (e.g. torch's harmless
          # "cudaGetDeviceCount() returned cudaErrorNotSupported" warning on a
          # GPU-less runner) into a terminating NativeCommandError. Relax it so
          # stderr is captured as text and our exit-code/marker logic can run.
          $ErrorActionPreference = 'Continue'
          # The CUDA-linked extension cannot initialize on a GPU-less CI runner.
          # The smoke test prints a "[smoke] SKIP:" marker in that case, but the
          # process can still exit non-zero during interpreter shutdown after the
          # failed CUDA DLL load. Treat a SKIP as success; fail on any real error.
          $output = python tests/wheel_smoke_test.py 2>&1 | Out-String
          Write-Host $output
          if ($output -match '\[smoke\] SKIP:') {
            Write-Host "Smoke test skipped on GPU-less runner - wheel build + DLL bundling validated."
            exit 0  # override any lingering non-zero LASTEXITCODE from the skip
          } elseif ($LASTEXITCODE -ne 0) {
            Write-Error "Smoke test failed (exit $LASTEXITCODE)"
            exit 1
          }

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel-Release-py${{ matrix.python-version }}
          path: "dist/*.whl"

  build-linux:
    runs-on: ubuntu-22.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        # cpXYZ tags map to /opt/python/<tag>-<tag> inside the manylinux image.
        python: ["cp313", "cp314"]
    env:
      SKBUILD_CONFIG: Release
      VCPKG_TARGET_TRIPLET: x64-linux-dynamic
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Python from manylinux image
        run: |
          PYBIN=/opt/python/${{ matrix.python }}-${{ matrix.python }}/bin
          echo "PYBIN=${PYBIN}" >> $GITHUB_ENV
          echo "${PYBIN}" >> $GITHUB_PATH
          "${PYBIN}/python" --version

      - name: Install system build deps (RHEL8)
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            ninja-build pkgconf-pkg-config \
            autoconf automake libtool \
            patchelf curl ca-certificates \
            zip unzip tar xz git which perl-IPC-Cmd
          gcc --version

      - name: Upgrade pip & install Python build deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install scikit-build-core pybind11 numpy ninja auditwheel

      - name: Install PyTorch (CUDA)
        run: |
          python -m pip install torch==2.12.0 torchvision==0.27.0 \
            --index-url https://download.pytorch.org/whl/cu132

      - name: Install CUDA toolkit (RHEL8)
        run: |
          dnf config-manager --add-repo \
            https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
          dnf clean all
          dnf install -y cuda-toolkit-13-1
          echo "CUDA_HOME=/usr/local/cuda-13.1" >> $GITHUB_ENV
          echo "/usr/local/cuda-13.1/bin" >> $GITHUB_PATH

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg
            ${{ runner.temp }}/vcpkg/installed
            ${{ runner.temp }}/vcpkg/archives
          key: vcpkg-manylinux_2_28-${{ env.VCPKG_TARGET_TRIPLET }}-v3-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            vcpkg-manylinux_2_28-${{ env.VCPKG_TARGET_TRIPLET }}-v3-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d "${RUNNER_TEMP}/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "${RUNNER_TEMP}/vcpkg"
          fi
          "${RUNNER_TEMP}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Set VCPKG env vars
        run: |
          echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_FILE=${RUNNER_TEMP}/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${RUNNER_TEMP}/vcpkg/installed/x64-linux-dynamic" >> $GITHUB_ENV

      - name: Install C++ deps via vcpkg
        run: |
          "${RUNNER_TEMP}/vcpkg/vcpkg" install spdlog fmt \
            --triplet x64-linux-dynamic --recurse

      - name: Download FFmpeg
        run: |
          chmod +x tools/download_ffmpeg.sh
          ./tools/download_ffmpeg.sh

      - name: Build Linux wheel
        env:
          CMAKE_GENERATOR: Ninja
          SKBUILD_CONFIG: Release
          NELUX_ENABLE_CUDA: "ON"
          NELUX_BUNDLE_FFMPEG_DLLS: "OFF"
        run: |
          export VCPKG_ROOT="${RUNNER_TEMP}/vcpkg"
          export VCPKG_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          export VCPKG_TARGET_TRIPLET=x64-linux-dynamic
          export CMAKE_PREFIX_PATH="${VCPKG_ROOT}/installed/x64-linux-dynamic"

          export CMAKE_ARGS="\
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_TOOLCHAIN_FILE} \
            -DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET} \
            -DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH} \
            -DNELUX_ENABLE_CUDA=ON \
            -DNELUX_BUNDLE_FFMPEG_DLLS=OFF"

          python -m pip wheel . --no-deps --no-build-isolation -w dist -v

      - name: Repair wheel with auditwheel
        run: |
          WHEEL=$(ls dist/*.whl | head -n1)
          VCPKG_LIB="${RUNNER_TEMP}/vcpkg/installed/x64-linux-dynamic/lib"
          FFMPEG_LIB="${GITHUB_WORKSPACE}/external/ffmpeg/lib"
          TORCH_LIB=$(python -c "import torch, os; print(os.path.join(os.path.dirname(torch.__file__), 'lib'))")
          export LD_LIBRARY_PATH="${VCPKG_LIB}:${FFMPEG_LIB}:${TORCH_LIB}:${LD_LIBRARY_PATH:-}"

          EXCLUDES=(
            libtorch.so libtorch_cpu.so libtorch_python.so libtorch_cuda.so
            libc10.so libc10_cuda.so libshm.so
            libavcodec.so.* libavformat.so.* libavutil.so.*
            libavfilter.so.* libavdevice.so.*
            libswscale.so.*
            libcudart.so.* libnvrtc.so.* libnvrtc-builtins.so.*
            libcufft.so.* libcurand.so.* libcusolver.so.*
            libcusparse.so.* libcublas.so.* libcublasLt.so.*
            libcudnn.so.* libnvToolsExt.so.*
          )
          EXCLUDE_ARGS=()
          for l in "${EXCLUDES[@]}"; do EXCLUDE_ARGS+=(--exclude "$l"); done

          mkdir -p dist_repaired
          auditwheel repair "${WHEEL}" \
            --plat manylinux_2_28_x86_64 \
            "${EXCLUDE_ARGS[@]}" \
            -w dist_repaired

          rm -f dist/*.whl
          mv dist_repaired/*.whl dist/
          rm -rf dist_repaired

      - name: Test wheel (import + real decode smoke test)
        run: |
          pip install dist/*.whl --force-reinstall
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/external/ffmpeg/lib:${LD_LIBRARY_PATH:-}"
          export PATH="${GITHUB_WORKSPACE}/external/ffmpeg/bin:${PATH}"
          export FFMPEG_BIN="${GITHUB_WORKSPACE}/external/ffmpeg/bin"
          python tests/wheel_smoke_test.py

      - name: Verify import on CPU-only torch (lite-profile regression guard)
        run: |
          set -euo pipefail
          # Fresh env with CPU-only torch — the previously-broken "lite" profile.
          # The wheel MUST import here: no eager libc10_cuda.so (resolved via
          # dlsym) and no eager libcudart.so (static-linked). A failure means the
          # CPU-torch import regression is back.
          python -m venv /tmp/cpuenv
          . /tmp/cpuenv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "torch==2.12.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy  # nelux/batch.py imports numpy; the torch CPU index doesn't carry it
          python -m pip install dist/*.whl
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/external/ffmpeg/lib:${LD_LIBRARY_PATH:-}"
          export PATH="${GITHUB_WORKSPACE}/external/ffmpeg/bin:${PATH}"
          export FFMPEG_BIN="${GITHUB_WORKSPACE}/external/ffmpeg/bin"
          python -c "import torch; assert torch.version.cuda is None, torch.version.cuda; import nelux; print('import OK on CPU torch:', nelux.__version__)"
          # Locate the .so via find_spec (does NOT execute nelux/__init__.py, so it
          # avoids the "import torch first" guard) for the NEEDED assertion.
          SO=$(python -c "import importlib.util,glob,os; s=importlib.util.find_spec('nelux'); print(glob.glob(os.path.join(os.path.dirname(s.origin),'_nelux*.so'))[0])")
          echo "== NEEDED of $SO =="; readelf -d "$SO" | grep NEEDED || true
          if readelf -d "$SO" | grep -qE 'NEEDED.*(libc10_cuda|libcudart|libtorch_cuda)'; then
            echo "FAIL: eager CUDA lib still in NEEDED (import would break on CPU-only torch)"; exit 1
          fi
          echo "OK: no eager CUDA libs in NEEDED"
          python tests/wheel_smoke_test.py
          deactivate

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheel-Release-py${{ matrix.python }}
          path: "dist/*.whl"

  build-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      SKBUILD_CONFIG: Release
      VCPKG_TARGET_TRIPLET: arm64-osx-dynamic
      # 14.0: vcpkg openssl (libssl/libcrypto) and libswresample built on the
      # macos-14 runner carry a min-target of 14.0, so delocate rejects a 12.0
      # wheel. Match the floor to what the bundled dylibs actually require.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Homebrew build deps
        run: |
          brew update
          brew install ninja pkg-config autoconf automake libtool coreutils

      - name: Upgrade pip & install Python build deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install scikit-build-core pybind11 numpy ninja delocate

      - name: Install PyTorch (CPU, arm64)
        run: |
          python -m pip install torch==2.12.0 torchvision==0.27.0

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg
            ${{ runner.temp }}/vcpkg/installed
            ${{ runner.temp }}/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-v2-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d "${{ runner.temp }}/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
          fi
          "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Set VCPKG env vars
        run: |
          echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_FILE=${RUNNER_TEMP}/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${RUNNER_TEMP}/vcpkg/installed/${VCPKG_TARGET_TRIPLET}" >> $GITHUB_ENV

      - name: Install C++ deps via vcpkg
        run: |
          "${{ runner.temp }}/vcpkg/vcpkg" install spdlog fmt \
            --triplet ${VCPKG_TARGET_TRIPLET} --recurse

      - name: Install FFmpeg
        run: |
          chmod +x tools/download_ffmpeg.sh
          ./tools/download_ffmpeg.sh

      - name: Build macOS wheel
        env:
          CMAKE_GENERATOR: Ninja
          SKBUILD_CONFIG: Release
          NELUX_ENABLE_CUDA: "OFF"
          NELUX_BUNDLE_FFMPEG_DLLS: "OFF"
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          export VCPKG_ROOT="${RUNNER_TEMP}/vcpkg"
          export VCPKG_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          export CMAKE_PREFIX_PATH="${VCPKG_ROOT}/installed/${VCPKG_TARGET_TRIPLET}"

          export CMAKE_ARGS="\
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_TOOLCHAIN_FILE} \
            -DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET} \
            -DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH} \
            -DNELUX_ENABLE_CUDA=OFF \
            -DNELUX_BUNDLE_FFMPEG_DLLS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0"

          python -m pip wheel . --no-deps --no-build-isolation -w dist -v

      - name: Repair wheel with delocate
        run: |
          WHEEL=$(ls dist/*.whl | head -n1)
          VCPKG_LIB="${RUNNER_TEMP}/vcpkg/installed/${VCPKG_TARGET_TRIPLET}/lib"
          FFMPEG_LIB="${GITHUB_WORKSPACE}/external/ffmpeg/lib"
          TORCH_LIB=$(python -c "import torch, os; print(os.path.join(os.path.dirname(torch.__file__), 'lib'))")
          export DYLD_LIBRARY_PATH="${VCPKG_LIB}:${FFMPEG_LIB}:${TORCH_LIB}:${DYLD_LIBRARY_PATH:-}"
          export DYLD_FALLBACK_LIBRARY_PATH="${DYLD_LIBRARY_PATH}"

          mkdir -p dist_repaired
          delocate-wheel -v \
            -e libtorch -e libc10 -e libshm \
            -e libavcodec -e libavformat -e libavutil \
            -e libavfilter -e libavdevice \
            -e libswscale \
            -w dist_repaired \
            "${WHEEL}"

          rm -f dist/*.whl
          mv dist_repaired/*.whl dist/
          rm -rf dist_repaired

      - name: Test wheel (import + real decode smoke test)
        run: |
          pip install dist/*.whl --force-reinstall
          export DYLD_LIBRARY_PATH="${GITHUB_WORKSPACE}/external/ffmpeg/lib:${DYLD_LIBRARY_PATH:-}"
          export DYLD_FALLBACK_LIBRARY_PATH="${DYLD_LIBRARY_PATH}"
          export PATH="${GITHUB_WORKSPACE}/external/ffmpeg/bin:${PATH}"
          export FFMPEG_BIN="${GITHUB_WORKSPACE}/external/ffmpeg/bin"
          python tests/wheel_smoke_test.py

      - name: Upload macOS wheel
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheel-Release-arm64-py${{ matrix.python-version }}
          path: "dist/*.whl"

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download all platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: "*-wheel-Release-*"
          path: dist
          merge-multiple: true
      - name: List all files for debug
        run: ls -lR dist
      - name: Install tomllib (if needed)
        run: python3 -m pip install toml pybind11
      - name: Extract version from pyproject.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Extract changelog for this version
        id: get_changelog
        shell: bash
        run: |
          # Extract content between the first version header and the next version header (or end of relevant content)
          # The changelog format uses: ### **Version X.Y.Z (YYYY-MM-DD)**
          CHANGELOG_CONTENT=$(awk '
            /^### \*\*Version / {
              if (found) exit;  # Stop at the next version header
              found=1;
              next;  # Skip the version header line itself
            }
            found && /^---$/ { exit; }  # Stop at horizontal rule separator
            found { print; }
          ' docs/CHANGELOG.md)

          # Write to a file to preserve multiline content
          echo "$CHANGELOG_CONTENT" > changelog_excerpt.md

          # Also set as output (escaped for GitHub Actions)
          {
            echo 'changelog<<EOF'
            cat changelog_excerpt.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      - name: Create tag for this version
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # On tag-triggered runs the tag already exists; only create+push
          # when the run was dispatched manually from a branch.
          if git rev-parse -q --verify "refs/tags/v${{ env.VERSION }}" >/dev/null; then
            echo "Tag v${{ env.VERSION }} already exists, skipping create."
          else
            git tag v${{ env.VERSION }}
            git push origin v${{ env.VERSION }}
          fi
      - name: Flatten wheel artifacts to top-level dist/
        run: |
          find dist -name '*.whl' -exec mv {} dist/ \;
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          bodyFile: changelog_excerpt.md
          artifacts: "dist/*.whl"

  pypi-publish:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/p/nelux
    permissions:
      id-token: write
    steps:
      - name: Download all platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: "*-wheel-Release-*"
          path: dist
          merge-multiple: true

      - name: Flatten wheels into top-level dist/
        run: |
          mkdir -p upload
          find dist -type f -name '*.whl' -exec mv -t upload {} +
          find dist -type f -name '*.tar.gz' -exec mv -t upload {} + || true
          rm -rf dist
          mv upload dist
          ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
