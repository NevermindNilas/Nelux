name: Build Wheels (macOS)

on:
  workflow_dispatch:

env:
  VCPKG_LIBRARY_LINKAGE: dynamic
  # 14.0: bundled vcpkg openssl + libswresample carry a 14.0 min-target on the
  # macos-14 runner; delocate rejects a 12.0 wheel otherwise.
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build-macos:
    # macos-14 is Apple Silicon (arm64). Swap to macos-13 for an x86_64 build.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      SKBUILD_CONFIG: Release
      VCPKG_TARGET_TRIPLET: arm64-osx-dynamic
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Homebrew build deps
        run: |
          brew update
          brew install ninja pkg-config autoconf automake libtool coreutils

      - name: Upgrade pip & install Python build deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install scikit-build-core pybind11 numpy ninja delocate

      - name: Install PyTorch (CPU, arm64)
        run: |
          # Apple Silicon torch wheels live on PyPI (CPU / MPS backend only — no CUDA on mac).
          python -m pip install torch==2.13.0 torchvision==0.28.0

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg
            ${{ runner.temp }}/vcpkg/installed
            ${{ runner.temp }}/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-v2-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d "${{ runner.temp }}/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
          fi
          "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Set VCPKG env vars
        run: |
          echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_FILE=${RUNNER_TEMP}/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${RUNNER_TEMP}/vcpkg/installed/${VCPKG_TARGET_TRIPLET}" >> $GITHUB_ENV

      - name: Install C++ deps via vcpkg
        run: |
          "${{ runner.temp }}/vcpkg/vcpkg" install spdlog fmt \
            --triplet ${VCPKG_TARGET_TRIPLET} --recurse

      - name: Download pinned TAS-FFMPEG build (headers + dylibs, shipped in the wheel)
        run: |
          # No longer Homebrew. Homebrew is a rolling package manager with no
          # pinnable hash, which made macOS the one platform that could not be
          # held to an exact build; the TAS-FFMPEG tarballs fix that, and these
          # dylibs end up INSIDE the wheel via delocate below.
          chmod +x tools/download_ffmpeg.sh
          ./tools/download_ffmpeg.sh
          ls -l external/ffmpeg/lib | head -30

      - name: Build macOS wheel
        env:
          CMAKE_GENERATOR: Ninja
          SKBUILD_CONFIG: Release
          NELUX_ENABLE_CUDA: "OFF"
          NELUX_BUNDLE_FFMPEG_DLLS: "ON"
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          export VCPKG_ROOT="${RUNNER_TEMP}/vcpkg"
          export VCPKG_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          export CMAKE_PREFIX_PATH="${VCPKG_ROOT}/installed/${VCPKG_TARGET_TRIPLET}"

          export CMAKE_ARGS="\
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_TOOLCHAIN_FILE} \
            -DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET} \
            -DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH} \
            -DNELUX_ENABLE_CUDA=OFF \
            -DNELUX_BUNDLE_FFMPEG_DLLS=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0"

          echo "CMAKE_ARGS: $CMAKE_ARGS"
          python -c "import torch; print('Building Nelux against torch', torch.__version__, 'cuda', torch.version.cuda)"
          python -m pip wheel . --no-deps --no-build-isolation -w dist -v

      - name: Debug - list artifacts
        run: |
          echo "=== nelux/ (post-build) ==="
          find nelux -maxdepth 2 -type f || true
          echo "=== dist/ ==="
          ls -la dist/

      - name: Repair wheel with delocate (bundle sibling dylibs + FFmpeg, exclude torch)
        run: |
          WHEEL=$(ls dist/*.whl | head -n1)
          echo "Repairing: ${WHEEL}"

          VCPKG_LIB="${RUNNER_TEMP}/vcpkg/installed/${VCPKG_TARGET_TRIPLET}/lib"
          FFMPEG_LIB="${GITHUB_WORKSPACE}/external/ffmpeg/lib"
          TORCH_LIB=$(python -c "import torch, os; print(os.path.join(os.path.dirname(torch.__file__), 'lib'))")

          export DYLD_LIBRARY_PATH="${VCPKG_LIB}:${FFMPEG_LIB}:${TORCH_LIB}:${DYLD_LIBRARY_PATH:-}"
          export DYLD_FALLBACK_LIBRARY_PATH="${DYLD_LIBRARY_PATH}"

          mkdir -p dist_repaired
          # Exclude torch only — it is already a runtime dependency of nelux.
          # FFmpeg is deliberately NOT excluded any more: the TAS-FFMPEG dylibs
          # carry install_name @rpath/lib<x>.<major>.dylib and CMake gives the
          # extension an rpath into external/ffmpeg/lib, so delocate can follow
          # them, copy them into nelux/.dylibs and rewrite the references to
          # @loader_path. That is what makes the wheel self-contained.
          delocate-wheel -v \
            -e libtorch -e libc10 -e libshm \
            -w dist_repaired \
            "${WHEEL}"

          rm -f dist/*.whl
          mv dist_repaired/*.whl dist/
          rm -rf dist_repaired
          python tools/tag_wheel_torch.py dist/*.whl
          echo "=== Repaired wheel ==="
          ls -la dist/

      - name: List wheel contents
        run: |
          echo "=== Wheel contents ==="
          unzip -l dist/*.whl | grep -E 'nelux/' || true

      - name: Verify the wheel ships FFmpeg and its licences
        run: |
          # The whole point of the retarget: a wheel that needs nothing on
          # DYLD_LIBRARY_PATH. Assert the dylibs and the GPL paper trail are
          # actually inside it, with the soname majors tools/ffmpeg.lock pins.
          python tools/verify_wheel_ffmpeg.py dist/*.whl

      - name: Test wheel (import + real decode smoke test)
        run: |
          pip install dist/*.whl --force-reinstall

          # external/ffmpeg is deliberately NOT on DYLD_*_PATH: the wheel has to
          # stand on its own vendored dylibs, and pointing the loader at the
          # build tree would hide exactly the failure this step catches.
          # FFMPEG_BIN stays so tests that shell out to ffmpeg still find one.
          export FFMPEG_BIN="${GITHUB_WORKSPACE}/external/ffmpeg/bin"

          python tests/wheel_smoke_test.py

      - name: Upload macOS wheel
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheel-arm64-py${{ matrix.python-version }}
          path: dist/*.whl
