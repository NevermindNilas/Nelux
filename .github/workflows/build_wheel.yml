name: Build Wheels Only

on:
  workflow_dispatch:
env:
  VCPKG_LIBRARY_LINKAGE: dynamic

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      SKBUILD_CONFIG: Release
      VCPKG_TARGET_TRIPLET: x64-windows-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Upgrade pip & install deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install scikit-build-core pybind11 numpy ninja
          python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cu132

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg
            ${{ runner.temp }}/vcpkg/installed
            ${{ runner.temp }}/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-dav1d-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-dav1d-v2-

      - name: Bootstrap vcpkg
        shell: powershell
        run: |
          if (-not (Test-Path "${{ runner.temp }}/vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
          }
          & "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Update vcpkg ports
        shell: cmd
        run: |
          cd "${{ runner.temp }}\vcpkg"
          git fetch origin master
          git reset --hard origin/master
          git clean -fd

      - name: Set VCPKG env vars
        shell: bash
        run: |
          echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg"                          >> $GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_FILE=${RUNNER_TEMP}/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=x64-windows-release"                        >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${RUNNER_TEMP}/vcpkg/installed/x64-windows-release"                       >> $GITHUB_ENV

      - name: Install C++ deps via vcpkg
        shell: cmd
        run: |
          "${{ runner.temp }}\vcpkg\vcpkg" install spdlog fmt --triplet x64-windows-release --recurse

      - name: Download FFmpeg master for build (headers/libs only)
        shell: powershell
        run: |
          # Match TheAnimeScripter's packaged ffmpeg_shared DLL ABI. Build needs headers + import libs
          # only; DLLs are NOT bundled — users must have FFmpeg in their PATH.
          $FFmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          $OutputDir = "${{ github.workspace }}/external/ffmpeg"
          $TempDir = "${{ runner.temp }}/ffmpeg_download"

          New-Item -ItemType Directory -Path $TempDir -Force | Out-Null
          New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null

          Write-Host "Downloading FFmpeg master (for build-time headers/libs only)..."
          curl.exe -L --retry 3 --retry-delay 2 -o "$TempDir/ffmpeg.zip" $FFmpegUrl

          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path "$TempDir/ffmpeg.zip" -DestinationPath "$TempDir/extracted" -Force

          $FFmpegDir = Get-ChildItem -Path "$TempDir/extracted" -Directory | Select-Object -First 1
          # Copy all directories including bin (needed for running tests, but NOT bundled by CMake)
          Copy-Item -Path "$($FFmpegDir.FullName)/bin" -Destination $OutputDir -Recurse -Force
          Copy-Item -Path "$($FFmpegDir.FullName)/lib" -Destination $OutputDir -Recurse -Force
          Copy-Item -Path "$($FFmpegDir.FullName)/include" -Destination $OutputDir -Recurse -Force

          # Verify FFmpeg DLLs
          Write-Host "=== Verifying FFmpeg DLLs ==="
          $DllPattern = "$OutputDir/bin/avcodec-*.dll"
          $DllFiles = Get-ChildItem -Path $DllPattern
          if ($DllFiles) {
              Write-Host "Found: $($DllFiles.Name)"
          }

          Write-Host "=== FFmpeg installed (headers/libs for build, bin for testing) ==="

      - name: Setup CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        id: cuda-toolkit
        with:
          cuda: "13.1.0"
          method: "local"
          use-github-cache: true
          use-local-cache: true

      - name: Verify and Fix CUDA installation
        shell: bash
        run: |
          echo "CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          ls -la "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin/" | head -20
          "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin/nvcc.exe" --version

          CUDA_INC="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/include"
          echo "Checking for host_config.h in $CUDA_INC..."

          # CUDA 13.x moved host_config.h - fix by ensuring it exists in include/crt/
          if [ -f "$CUDA_INC/crt/host_config.h" ]; then
            echo "SUCCESS: host_config.h found at include/crt/"
          elif [ -f "$CUDA_INC/host_config.h" ]; then
            echo "FOUND: host_config.h at include/ (CUDA 13.x location)"
            echo "FIXING: Copying to include/crt/host_config.h for compatibility..."
            mkdir -p "$CUDA_INC/crt"
            cp "$CUDA_INC/host_config.h" "$CUDA_INC/crt/host_config.h"
            echo "FIX APPLIED."
          else
            echo "FATAL: host_config.h NOT found!"
            echo "CUDA installation is incomplete. Cannot build CUDA wheel."
            find "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" -name "host_config.h" || true
            exit 1
          fi

      - name: Build Windows wheel
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
          SKBUILD_CONFIG: Release
          NELUX_ENABLE_CUDA: "ON"
          NELUX_BUNDLE_FFMPEG_DLLS: "OFF"
          # Skip CMake-side DLL install — delvewheel will pick up vcpkg DLLs
          # via --add-path and bundle them into nelux.libs/ (avoids duplicates).
          NELUX_SKIP_DLL_INSTALL: "ON"
        run: |
          # Convert backslashes to forward slashes to avoid CMake escaping issues on Windows
          TEMP_FWD=$(echo "$RUNNER_TEMP" | tr '\\' '/')

          # Sanitize CUDA_PATH path as well
          CUDA_PATH_FWD=$(echo "$CUDA_PATH" | tr '\\' '/')
          export CUDA_PATH="$CUDA_PATH_FWD"

          export VCPKG_ROOT="${TEMP_FWD}/vcpkg"
          export VCPKG_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          export VCPKG_TARGET_TRIPLET=x64-windows-release
          export CMAKE_PREFIX_PATH="${VCPKG_ROOT}/installed/x64-windows-release"

          # Construct CMAKE_ARGS with sanitized paths and explicit wheel-bundling policy.
          export CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=${VCPKG_TOOLCHAIN_FILE} -DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET} -DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH} -DNELUX_ENABLE_CUDA=ON -DNELUX_BUNDLE_FFMPEG_DLLS=OFF"

          echo "CMAKE_ARGS: $CMAKE_ARGS"
          python -c "import torch; print('Building Nelux against torch', torch.__version__, 'cuda', torch.version.cuda)"
          # Use --no-build-isolation so we usage the pre-installed CUDA-enabled Torch
          python -m pip wheel . --no-deps --no-build-isolation -w dist -v

      - name: Debug - List nelux folder and wheel contents
        shell: powershell
        run: |
          Write-Host "=== Contents of nelux/ folder (post-build) ==="
          Get-ChildItem -Path nelux -Recurse | ForEach-Object { 
            Write-Host "$($_.Length) bytes - $($_.FullName)" 
          }
          Write-Host "=== Contents of dist/ folder ==="
          Get-ChildItem -Path dist | ForEach-Object { 
            Write-Host "$($_.Length) bytes - $($_.Name)" 
          }

      - name: Repair wheel with delvewheel (bundle DLLs)
        shell: powershell
        run: |
          Write-Host "=== Installing delvewheel ==="
          pip install delvewheel

          Write-Host "=== Setting up DLL search paths ==="
          $VcpkgBin = Join-Path $env:RUNNER_TEMP "vcpkg\installed\x64-windows-release\bin"

          # Locating Torch DLLs (needed so delvewheel finds them, but we EXCLUDE them from bundling)
          $TorchSite = python -c "import torch, os; print(os.path.dirname(torch.__file__))"
          $TorchLib = Join-Path $TorchSite "lib"

          # FFmpeg DLLs (for build/test, but NOT bundled)
          $FFmpegBin = "${{ github.workspace }}/external/ffmpeg/bin"

          # Dynamically get list of ALL FFmpeg DLLs to exclude them
          $FFmpegDlls = Get-ChildItem -Path $FFmpegBin -Filter "*.dll" | Select-Object -ExpandProperty Name
          $FFmpegExclude = $FFmpegDlls -join ";"

          # Dynamically enumerate CUDA + Torch DLLs so we exclude the EXACT
          # versioned filenames (e.g. nvrtc64_130_0.dll, nvrtc-builtins64_131.dll).
          # delvewheel --exclude matches literal filenames only — globs like
          # "nvrtc64*.dll" do NOT match and would cause those DLLs to be bundled,
          # inflating the wheel ~100 MB. We scan BOTH torch/lib and the CUDA
          # toolkit bin because the dep walker may pick up either copy depending
          # on PATH ordering, and they may have different minor versions.
          # NOTE: c10.dll is deliberately NOT excluded -- it is bundled into the
          # wheel so the torch-free NumPy backend imports and decodes with PyTorch
          # not installed. c10.dll cannot be delay-loaded (data-symbol import,
          # LNK1194) and depends only on the system CRT, so it is self-contained.
          # torch_cpu/torch_python/torch are delay-loaded and resolved from the
          # user's own PyTorch install when the PyTorch backend runs, so they stay
          # excluded (must match the user's torch ABI).
          $CudaPatterns = @(
            "cudart64_*.dll", "nvrtc64_*.dll", "nvrtc-builtins64_*.dll",
            "cufft64_*.dll", "curand64_*.dll", "cusolver64_*.dll",
            "cusparse64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll",
            "cudnn*64_*.dll", "nvToolsExt64_*.dll", "caffe2_nvrtc.dll",
            "torch.dll", "torch_cpu.dll", "torch_cuda.dll",
            "torch_python.dll", "c10_cuda.dll", "shm.dll"
          )
          $ScanDirs = @($TorchLib)
          if ($env:CUDA_PATH -and (Test-Path (Join-Path $env:CUDA_PATH 'bin'))) {
            $ScanDirs += (Join-Path $env:CUDA_PATH 'bin')
          }
          $TorchDllNames = foreach ($d in $ScanDirs) {
            Get-ChildItem -Path (Join-Path $d '*.dll') -File -ErrorAction SilentlyContinue `
              | Select-Object -ExpandProperty Name `
              | Where-Object {
                  $name = $_
                  $CudaPatterns | Where-Object { $name -like $_ } | Select-Object -First 1
                }
          }
          $TorchExclude = ($TorchDllNames | Sort-Object -Unique) -join ";"

          Write-Host "VCPKG bin: $VcpkgBin"
          Write-Host "Torch lib: $TorchLib"
          Write-Host "FFmpeg bin: $FFmpegBin"
          Write-Host "Excluding FFmpeg DLLs: $FFmpegExclude"
          Write-Host "Excluding Torch/CUDA DLLs: $TorchExclude"

          # Find the wheel file
          $WheelFile = Get-ChildItem dist/*.whl | Select-Object -First 1
          Write-Host "Repairing wheel: $($WheelFile.FullName)"

          New-Item -ItemType Directory -Path dist_repaired -Force | Out-Null

          # Run delvewheel repair
          # CUDA / Torch DLLs come from the user's PyTorch install at runtime —
          # we never bundle them. FFmpeg DLLs likewise must be user-provided.
          delvewheel repair $WheelFile.FullName `
            --add-path "$VcpkgBin" `
            --add-path "$TorchLib" `
            --add-path "$FFmpegBin" `
            --exclude "$TorchExclude;$FFmpegExclude" `
            --wheel-dir dist_repaired `
            -v

          # Replace original wheel with repaired one
          Remove-Item dist/*.whl -Force
          Move-Item dist_repaired/*.whl dist/
          Remove-Item dist_repaired -Recurse -Force
          python tools/tag_wheel_torch.py (Get-ChildItem dist/*.whl).FullName
          Write-Host "=== Wheel repair complete ==="

      - name: List wheel contents
        run: |
          echo "=== Wheel contents (CUDA DLLs bundled via delvewheel, FFmpeg NOT bundled) ==="
          unzip -l dist/*.whl | grep nelux/

      - name: Test wheel (import + real decode smoke test)
        shell: powershell
        run: |
          Write-Host "=== Installing wheel ==="
          pip install (Get-ChildItem dist/*.whl) --force-reinstall

          $FFmpegBin = Join-Path $pwd "external\ffmpeg\bin"
          $env:PATH = "$FFmpegBin;$env:PATH"
          $env:FFMPEG_BIN = $FFmpegBin

          # GitHub's powershell shell runs with $ErrorActionPreference='Stop',
          # which turns ANY native stderr line (e.g. torch's harmless
          # "cudaGetDeviceCount() returned cudaErrorNotSupported" warning on a
          # GPU-less runner) into a terminating NativeCommandError. Relax it so
          # stderr is captured as text and our exit-code/marker logic can run.
          $ErrorActionPreference = 'Continue'
          # The CUDA-linked extension cannot initialize on a GPU-less CI runner.
          # The smoke test prints a "[smoke] SKIP:" marker in that case, but the
          # process can still exit non-zero during interpreter shutdown after the
          # failed CUDA DLL load. Treat a SKIP as success; fail on any real error.
          $output = python tests/wheel_smoke_test.py 2>&1 | Out-String
          Write-Host $output
          if ($output -match '\[smoke\] SKIP:') {
            Write-Host "Smoke test skipped on GPU-less runner - wheel build + DLL bundling validated."
            exit 0  # override any lingering non-zero LASTEXITCODE from the skip
          } elseif ($LASTEXITCODE -ne 0) {
            Write-Error "Smoke test failed (exit $LASTEXITCODE)"
            exit 1
          }

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel-py${{ matrix.python-version }}
          path: "dist/*.whl"
